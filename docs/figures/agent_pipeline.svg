<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 124" width="980" height="124" role="img" aria-label="5-Phase Autonomous Multi-Agent Engineering Pipeline">
  <defs>
    <style>
      .bg { fill: #FBFBFA; stroke: #E4E2DC; stroke-width: 1; }
      .card { fill: #FFFFFF; stroke: #D9D7D0; stroke-width: 1.25; rx: 10; }
      .card-blue { fill: #EBF3FA; stroke: #B8D6EE; stroke-width: 1.25; rx: 10; }
      .card-amber { fill: #FBF3DB; stroke: #E6D39A; stroke-width: 1.25; rx: 10; }
      .card-green { fill: #EDF3EC; stroke: #BBD8B7; stroke-width: 1.25; rx: 10; }
      .tag { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #666560; }
      .h { font: 600 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111111; }
      .s { font: 400 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4A4945; }
      .line { stroke: #666560; stroke-width: 1.6; fill: none; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#666560"/>
    </marker>
  </defs>

  <rect width="980" height="124" rx="12" class="bg"/>

  <rect x="18" y="18" width="172" height="88" class="card"/>
  <text x="32" y="40" class="tag">PHASE 1 · ANALYST</text>
  <text x="32" y="61" class="h">Understand</text>
  <text x="32" y="80" class="s">Gemini 4 Argon · Brief</text>
  <text x="32" y="94" class="s">&amp; invariant audit</text>

  <rect x="212" y="18" width="174" height="88" class="card"/>
  <text x="226" y="40" class="tag">PHASE 2 · ARCHITECT</text>
  <text x="226" y="61" class="h">Blueprint</text>
  <text x="226" y="80" class="s">Gemini 4 Argon · Types,</text>
  <text x="226" y="94" class="s">SQL &amp; test plan</text>

  <rect x="408" y="18" width="176" height="88" class="card-blue"/>
  <text x="422" y="40" class="tag">PHASE 3 · BUILDER</text>
  <text x="422" y="61" class="h">Build</text>
  <text x="422" y="80" class="s">Claude Sonnet 4.6 ·</text>
  <text x="422" y="94" class="s">Atomic commits</text>

  <rect x="606" y="18" width="176" height="88" class="card-amber"/>
  <text x="620" y="40" class="tag">PHASE 4 · REVIEWER</text>
  <text x="620" y="61" class="h">Adversarial Review</text>
  <text x="620" y="80" class="s">Claude Opus 5.5 ·</text>
  <text x="620" y="94" class="s">Read-only math &amp; QA</text>

  <rect x="804" y="18" width="158" height="88" class="card-green"/>
  <text x="818" y="40" class="tag">PHASE 5 · SHIP</text>
  <text x="818" y="61" class="h">Verify &amp; PR</text>
  <text x="818" y="80" class="s">just check + security</text>
  <text x="818" y="94" class="s">&amp; pull request</text>

  <path d="M 190 62 L 210 62" class="line" marker-end="url(#arr)"/>
  <path d="M 386 62 L 406 62" class="line" marker-end="url(#arr)"/>
  <path d="M 584 62 L 604 62" class="line" marker-end="url(#arr)"/>
  <path d="M 782 62 L 802 62" class="line" marker-end="url(#arr)"/>
</svg>
