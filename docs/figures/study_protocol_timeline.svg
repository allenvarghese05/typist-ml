<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 132" width="980" height="132" role="img" aria-label="14-Session Within-Subject Experimental Protocol">
  <defs>
    <style>
      .bg { fill: #FBFBFA; stroke: #E4E2DC; stroke-width: 1; }
      .card { fill: #FFFFFF; stroke: #D9D7D0; stroke-width: 1.25; rx: 10; }
      .card-blue { fill: #EBF3FA; stroke: #B8D6EE; stroke-width: 1.25; rx: 10; }
      .card-green { fill: #EDF3EC; stroke: #BBD8B7; stroke-width: 1.25; rx: 10; }
      .card-amber { fill: #FBF3DB; stroke: #E6D39A; stroke-width: 1.25; rx: 10; }
      .tag { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #666560; }
      .h { font: 600 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111111; }
      .s { font: 400 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4A4945; }
      .line { stroke: #666560; stroke-width: 1.6; fill: none; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#666560"/>
    </marker>
  </defs>

  <rect width="980" height="132" rx="12" class="bg"/>

  <!-- Step 1 -->
  <rect x="18" y="20" width="172" height="92" class="card"/>
  <text x="32" y="42" class="tag">SESSIONS 1-2 · FORM A</text>
  <text x="32" y="64" class="h">Baseline Assessment</text>
  <text x="32" y="83" class="s">Pool raw bigram errors</text>
  <text x="32" y="98" class="s">&amp; clean IKI latencies</text>

  <!-- Step 2 -->
  <rect x="212" y="20" width="180" height="92" class="card-amber"/>
  <text x="226" y="42" class="tag">END OF BASELINE · FREEZE</text>
  <text x="226" y="64" class="h">Empirical Bayes + Snake</text>
  <text x="226" y="83" class="s">Shrinkage rank, snake deal,</text>
  <text x="226" y="98" class="s">SQLite immutability lock</text>

  <!-- Step 3 -->
  <rect x="414" y="20" width="194" height="92" class="card-blue"/>
  <text x="428" y="42" class="tag">SESSIONS 3-12 · 10 DAYS</text>
  <text x="428" y="64" class="h">Masked Daily Practice</text>
  <text x="428" y="83" class="s">Latin-square Block 1..4</text>
  <text x="428" y="98" class="s">calibrated [0.10, 0.40] drills</text>

  <!-- Step 4 -->
  <rect x="630" y="20" width="162" height="92" class="card"/>
  <text x="644" y="42" class="tag">SESSIONS 13-14 · FORM B</text>
  <text x="644" y="64" class="h">Held-Out Retest</text>
  <text x="644" y="83" class="s">Unseen balanced prose</text>
  <text x="644" y="98" class="s">for transfer evaluation</text>

  <!-- Step 5 -->
  <rect x="814" y="20" width="148" height="92" class="card-green"/>
  <text x="828" y="42" class="tag">POST-STUDY · UNBLIND</text>
  <text x="828" y="64" class="h">Debrief &amp; DiD</text>
  <text x="828" y="83" class="s">Arm reveal, Beta CIs</text>
  <text x="828" y="98" class="s">&amp; coaching forensics</text>

  <!-- Arrows -->
  <path d="M 190 66 L 210 66" class="line" marker-end="url(#arr)"/>
  <path d="M 392 66 L 412 66" class="line" marker-end="url(#arr)"/>
  <path d="M 608 66 L 628 66" class="line" marker-end="url(#arr)"/>
  <path d="M 792 66 L 812 66" class="line" marker-end="url(#arr)"/>
</svg>
