# Local hooks only: each tool runs at the version pinned in the repo. ruff, bandit and Biome come
# from the app lockfiles (services/api/uv.lock, apps/web/pnpm-lock.yaml); actionlint is pinned in
# scripts/pre-commit-actionlint.sh and installed with uv tool (README). ruff and Biome auto-fix; a
# commit that a hook changed fails once, then passes after `git add`. pyright and tests run in
# `just check` and CI. The golden fixture is the source of truth for errors and is never touched
# by a tool.
exclude: ^services/api/tests/fixtures/golden_session\.json$
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (services/api)
        entry: bash scripts/pre-commit-ruff.sh
        language: system
        files: ^services/api/.*\.pyi?$
      - id: bandit
        name: bandit (services/api/src)
        entry: bash scripts/pre-commit-bandit.sh
        language: system
        files: ^services/api/src/.*\.py$
      - id: biome
        name: biome (apps/web)
        entry: bash scripts/pre-commit-biome.sh
        language: system
        files: ^apps/web/
      - id: actionlint
        name: actionlint (.github/workflows)
        entry: bash scripts/pre-commit-actionlint.sh
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
