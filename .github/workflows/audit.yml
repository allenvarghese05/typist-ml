# Weekly dependency audit (T0.4 owner answer 6, D22 amended by T0.4). Not a required check:
# advisory databases change without code changes. `just security-py` runs bandit and pip-audit,
# `just security-web` runs pnpm audit; an unreachable registry is reported as a skip (D22).
name: Audit

on:
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      UV_PROJECT_ENVIRONMENT: .venv
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable corepack (pnpm version from apps/web/package.json)
        working-directory: apps/web
        run: |
          corepack enable
          pnpm --version
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - name: Install just
        run: |
          uv tool install rust-just==1.58.0
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Python dependencies (just security-py)
        run: just security-py
      - name: Web dependencies (just security-web)
        if: ${{ !cancelled() }}
        run: just security-web
