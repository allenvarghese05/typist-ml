# Alembic configuration for services/api (design doc section 8: every schema change is a migration).
# There is no sqlalchemy.url here: alembic/env.py uses typist.config.Settings.db_path
# (TYPIST_DB_PATH), the same setting the app uses. Run migrations with `just migrate`.

[alembic]
script_location = %(here)s/alembic
path_separator = os

[post_write_hooks]
# New revision files are fixed and formatted with the ruff pinned in uv.lock, so they pass `just check`.
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = %(here)s/.venv/bin/ruff
ruff_fix.options = check --fix --config %(here)s/pyproject.toml REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format --config %(here)s/pyproject.toml REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
